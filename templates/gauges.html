
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SMT Line Performance</title>
    <link rel="icon" href="/static/images/favicon_reelScan.ico" type="image/x-icon">


    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }


        h1 {
            margin-top: 30px;
        }


        .gauges {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
            margin-top: 40px;
        }


        .gauge-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }


        .gauge-box h2 {
            margin-top: 0;
        }


        .gauge {
            width: 400px;
            height: 240px;
        }


        .values {
            display: flex;
            justify-content: space-around;
            margin-top: 5px;
        }


        .value {
            width: 100px;
        }


        .value-number {
            font-size: 26px;
            font-weight: bold;
        }


        .today {
            color: #d93025;
        }


        .currentwkavg {
            color: #1a73e8;
        }


        .FourWeeks {
            color: #222;
        }


        .legend {
            margin-top: 5px;
            margin-bottom: 15px;
        }


        .legend span {
            margin: 0 12px;
        }


        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }


        .dot-today {
            background: #d93025;
        }


        .dot-currentwkavg {
            background: #1a73e8;
        }


        .dot-FourWeeks {
            background: #222;
        }

    </style>

</head>


<body>


<h1>SMT Line Performance Chips/day</h1>


<div class="gauges">


    <!-- ========================= -->
    <!-- LINE 1                    -->
    <!-- ========================= -->

    <div class="gauge-box">

        <h2>Line-1</h2>


        <svg
            id="gauge-line1"
            class="gauge"
            viewBox="0 0 400 240">
        </svg>


        <div class="legend">

            <span>
                <span class="dot dot-today"></span>
                Today
            </span>

            <span>
                <span class="dot dot-currentwkavg"></span>
                Week
            </span>

            <span>
                <span class="dot dot-FourWeeks"></span>
                4 Weeks
            </span>

        </div>


        <div class="values">

            <div class="value">
                <!-- Today -->
                <div
                    id="line1-today"
                    class="value-number today">
                    0%
                </div>
            </div>


            <div class="value">
                <!-- Week -->
                <div
                    id="line1-currentwkavg"
                    class="value-number currentwkavg">
                    0%
                </div>
            </div>


            <div class="value">
                <!-- 4 Weeks -->
                <div
                    id="line1-FourWeeks"
                    class="value-number FourWeeks">
                    0%
                </div>
            </div>

        </div>

    </div>



    <!-- ========================= -->
    <!-- LINE 2                    -->
    <!-- ========================= -->

    <div class="gauge-box">

        <h2>Line-2</h2>


        <svg
            id="gauge-line2"
            class="gauge"
            viewBox="0 0 400 240">
        </svg>


        <div class="legend">

            <span>
                <span class="dot dot-today"></span>
                Today
            </span>

            <span>
                <span class="dot dot-currentwkavg"></span>
                Week
            </span>

            <span>
                <span class="dot dot-FourWeeks"></span>
                4 Weeks
            </span>

        </div>


        <div class="values">

            <div class="value">
                <!-- Today -->
                <div
                    id="line2-today"
                    class="value-number today">
                    0%
                </div>
            </div>


            <div class="value">
                <!-- Week -->
                <div
                    id="line2-currentwkavg"
                    class="value-number currentwkavg">
                    0%
                </div>
            </div>


            <div class="value">
                <!-- 4 Weeks -->
                <div
                    id="line2-FourWeeks"
                    class="value-number FourWeeks">
                    0%
                </div>
            </div>

        </div>

    </div>


</div>

<script>

        }
    </script> -->



    <button class="back-button" onclick="goBack()">
        Back to Main Page
    </button>

    <style>
        .back-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>

    <script>
        function goBack() {
            window.location.href = "/main";
        }
    </script>



<script src="{{ url_for('static', filename='js/gauge.js') }}"></script>


</body>

</html>
